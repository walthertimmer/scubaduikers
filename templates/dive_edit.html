{% extends "base.html" %}

{% block title %}Duik bewerken – Scubaduikers{% endblock %}

{% block content %}
<section class="form-section" style="max-width: 560px;">
    <h1>Duik bewerken</h1>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/dives/{{ dive.id }}/edit" id="dive-form">

        <div class="form-group">
            <label for="title">Titel <span class="field-optional">(optioneel)</span></label>
            <input type="text" id="title" name="title" value="{{ dive.title or '' }}" placeholder="bijv. Wrakduik Zeeland">
        </div>

        <div class="form-group">
            <label for="dive_date">Datum</label>
            <input type="date" id="dive_date" name="dive_date" value="{{ dive.date }}" required>
        </div>

        <div class="form-group">
            <label for="location">Locatie</label>
            <input type="text" id="location" name="location" value="{{ dive.location }}" required placeholder="bijv. Grevelingenmeer, Zeeland">
        </div>

        <div class="form-group">
            <label for="description">Beschrijving <span class="field-optional">(optioneel)</span></label>
            <textarea id="description" name="description" rows="3" placeholder="Extra informatie over de duik…">{{ dive.description or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="surface_coordinator">Oppervlakte coördinator <span class="field-optional">(optioneel)</span></label>
            <input type="text" id="surface_coordinator" name="surface_coordinator" value="{{ dive.surface_coordinator or '' }}" placeholder="Naam van de oppervlakte coördinator">
        </div>

        <div class="form-group">
            <label for="join_policy">Wie kan meedoen?</label>
            <select id="join_policy" name="join_policy" onchange="updateFormVisibility()">
                <option value="open" {% if dive.join_policy == 'open' %}selected{% endif %}>Open voor iedereen</option>
                {% if clubs %}
                <option value="club_only" {% if dive.join_policy == 'club_only' %}selected{% endif %}>Alleen voor clubleden</option>
                {% endif %}
                <option value="password_protected" {% if dive.join_policy == 'password_protected' %}selected{% endif %}>Met wachtwoord (besloten)</option>
            </select>
        </div>

        {% if clubs %}
        <div class="form-group" id="club-group">
            <label for="club_id">Organiserende club <span class="field-optional">(optioneel)</span></label>
            <select id="club_id" name="club_id">
                <option value="">– Geen club –</option>
                {% for club in clubs %}
                <option value="{{ club.id }}" {% if dive.organiser_club_id == club.id %}selected{% endif %}>{{ club.name }}</option>
                {% endfor %}
            </select>
            <small class="field-hint">Vereist bij "alleen voor clubleden".</small>
        </div>
        {% else %}
        <input type="hidden" name="club_id" value="">
        {% endif %}

        <div class="form-group" id="password-group" style="display:none">
            <label for="join_password">Nieuw wachtwoord <span class="field-optional">(leeg laten = ongewijzigd)</span></label>
            <input type="password" id="join_password" name="join_password" minlength="4">
        </div>

        <button type="submit">Opslaan</button>
    </form>

    <p class="form-footer"><a href="/dives/{{ dive.id }}">Terug naar duik</a></p>
</section>

<script>
function updateFormVisibility() {
    var policy = document.getElementById('join_policy').value;
    var pwGroup = document.getElementById('password-group');
    var pwInput = document.getElementById('join_password');
    var clubGroup = document.getElementById('club-group');

    if (pwGroup) {
        pwGroup.style.display = policy === 'password_protected' ? 'block' : 'none';
        pwInput.required = false;
    }
    if (clubGroup) {
        var clubSelect = document.getElementById('club_id');
        clubSelect.required = policy === 'club_only';
    }
}
updateFormVisibility();
</script>
{% endblock %}
